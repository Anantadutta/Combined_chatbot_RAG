# Render Blueprint: https://render.com/docs/blueprint-spec
# Render dashboard -> New -> Blueprint -> pick this repo. Then paste GEMINI_API_KEY when asked.
services:
  - type: web
    name: nexacorp-rag
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # entered in the dashboard, never stored in git
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: ADMIN_TOKEN
        generateValue: true    # protects upload / delete / reindex; copy it from the dashboard
